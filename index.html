<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parksheriff Melder Wien</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1c1c1e;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }
    h2 { text-align: center; margin-top: 10px; color: #ff3b30; }
    p { text-align: center; color: #8e8e93; font-size: 14px; }
    label { font-weight: bold; display: block; margin-top: 18px; margin-bottom: 6px; color: #e5e5ea; }
    select, input {
      width: 100%;
      padding: 14px;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: #2c2c2e;
      color: #ffffff;
      outline: none;
    }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      background-color: #ff3b30;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background-color: #d70015; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🚨 Parksheriff Melden</h2>
  <p>Melde eine Sichtung direkt in den Gruppenchat</p>

  <label for="bezirk">Bezirk auswählen:</label>
  <select id="bezirk">
    <script>
      for (let i = 1; i <= 23; i++) {
        document.write(`<option value="${i}. Bezirk">${i}. Bezirk</option>`);
      }
    </script>
  </select>

  <label for="strasse">Straße & Hausnummer / Gasse:</label>
  <input type="text" id="strasse" placeholder="z. B. Mariahilfer Straße 45">

  <button id="sendBtn" onclick="sendData()">Meldung Absenden</button>
  <div id="status"></div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); }

    const BOT_TOKEN = "8721563240:AAGfSIiv1rUz6I4TWnU7B2k5bjTQXEx63iA";

    async function sendData() {
      const bezirk = document.getElementById('bezirk').value;
      const strasse = document.getElementById('strasse').value.trim();
      const statusDiv = document.getElementById('status');
      const sendBtn = document.getElementById('sendBtn');

      if (!strasse) {
        alert("Bitte gib eine Straße ein!");
        return;
      }

      // Liest die Gruppen-Chat-ID direkt aus der URL
      const urlParams = new URLSearchParams(window.location.search);
      const chatId = urlParams.get('chat_id');

      if (!chatId) {
        statusDiv.style.color = "#ff3b30";
        statusDiv.innerText = "⚠️ Bitte den Link direkt über den Bot in Telegram öffnen!";
        return;
      }

      sendBtn.disabled = true;
      statusDiv.style.color = "#ffcc00";
      statusDiv.innerText = "Meldung wird gesendet...";

      let userName = "Anonym";
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        userName = tg.initDataUnsafe.user.first_name || "Anonym";
      }

      const reportText = `🚨 *PARKSHERIFF GESICHTET!* 🚨\n\n🏛 *Bezirk:* ${bezirk}\n📍 *Straße/Ort:* ${strasse}\n👤 *Gemeldet von:* ${userName}\n\n⚠️ _Achtung beim Parken!_`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            text: reportText,
            parse_mode: 'Markdown'
          })
        });

        if (response.ok) {
          statusDiv.style.color = "#30d158";
          statusDiv.innerText = "✅ Erfolgreich in der Gruppe gepostet!";
          setTimeout(() => {
            if (tg && tg.close) { tg.close(); }
          }, 1200);
        } else {
          statusDiv.style.color = "#ff3b30";
          statusDiv.innerText = "❌ Fehler beim Senden. Prüfe Bot-Rechte in der Gruppe!";
          sendBtn.disabled = false;
        }
      } catch (err) {
        statusDiv.style.color = "#ff3b30";
        statusDiv.innerText = "❌ Netzwerkfehler!";
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
