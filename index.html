<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parksheriff Melder</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ff4949;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2b5278;
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #e53935;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>

    <h2>🚨 Parksheriff Melden</h2>

    <div class="form-group">
        <label for="bezirk">Bezirk wählen:</label>
        <select id="bezirk">
            <option value="1. Bezirk (Innere Stadt)">1. Bezirk (Innere Stadt)</option>
            <option value="2. Bezirk (Leopoldstadt)">2. Bezirk (Leopoldstadt)</option>
            <option value="3. Bezirk (Landstraße)">3. Bezirk (Landstraße)</option>
            <option value="4. Bezirk (Wieden)">4. Bezirk (Wieden)</option>
            <option value="5. Bezirk (Margareten)">5. Bezirk (Margareten)</option>
            <option value="6. Bezirk (Mariahilf)">6. Bezirk (Mariahilf)</option>
            <option value="7. Bezirk (Neubau)">7. Bezirk (Neubau)</option>
            <option value="8. Bezirk (Josefstadt)">8. Bezirk (Josefstadt)</option>
            <option value="9. Bezirk (Alsergrund)">9. Bezirk (Alsergrund)</option>
            <option value="10. Bezirk (Favoriten)">10. Bezirk (Favoriten)</option>
            <option value="11. Bezirk (Simmering)">11. Bezirk (Simmering)</option>
            <option value="12. Bezirk (Meidling)">12. Bezirk (Meidling)</option>
            <option value="13. Bezirk (Hietzing)">13. Bezirk (Hietzing)</option>
            <option value="14. Bezirk (Penzing)">14. Bezirk (Penzing)</option>
            <option value="15. Bezirk (Rudolfsheim-Fünfhaus)">15. Bezirk (Rudolfsheim-Fünfhaus)</option>
            <option value="16. Bezirk (Ottakring)">16. Bezirk (Ottakring)</option>
            <option value="17. Bezirk (Hernals)">17. Bezirk (Hernals)</option>
            <option value="18. Bezirk (Währing)">18. Bezirk (Währing)</option>
            <option value="19. Bezirk (Döbling)">19. Bezirk (Döbling)</option>
            <option value="20. Bezirk (Brigittenau)">20. Bezirk (Brigittenau)</option>
            <option value="21. Bezirk (Floridsdorf)">21. Bezirk (Floridsdorf)</option>
            <option value="22. Bezirk (Donaustadt)">22. Bezirk (Donaustadt)</option>
            <option value="23. Bezirk (Liesing)">23. Bezirk (Liesing)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="strasse">Straße / Genaues Ort:</label>
        <input type="text" id="strasse" placeholder="z.B. Hauptstraße 12">
    </div>

    <button onclick="sendData()">🚨 MELDUNG ABSENDEN</button>

    <script>
        // Telegram WebApp initialisieren
        const tg = window.Telegram.WebApp;
        tg.expand(); // Fenster auf volle Höhe erweitern

        function sendData() {
            const bezirk = document.getElementById("bezirk").value;
            const strasse = document.getElementById("strasse").value.trim();

            if (!strasse) {
                alert("Bitte gib eine Straße oder einen Ort an!");
                return;
            }

            const payload = JSON.stringify({
                bezirk: bezirk,
                strasse: strasse
            });

            // Sendet die Daten zwingend an den Bot zurück
            tg.sendData(payload);
        }
    </script>
</body>
</html>
