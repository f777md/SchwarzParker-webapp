<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parksheriff Melder</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      padding: 20px;
      margin: 0;
    }
    h2 { text-align: center; margin-top: 0; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000000);
    }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>🚨 Parksheriff Melden</h2>

  <label for="bezirk">Bezirk auswählen:</label>
  <select id="bezirk">
    <!-- Generiert Optionen von 1. bis 23. Bezirk -->
    <script>
      for (let i = 1; i <= 23; i++) {
        document.write(`<option value="${i}. Bezirk">${i}. Bezirk</option>`);
      }
    </script>
  </select>

  <label for="strasse">Straße & Hausnummer / Gasse:</label>
  <input type="text" id="strasse" placeholder="z. B. Mariahilfer Straße 45">

  <button onclick="sendData()">Meldung Absenden</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Mini-App auf volle Höhe aufziehen

    function sendData() {
      const bezirk = document.getElementById('bezirk').value;
      const strasse = document.getElementById('strasse').value.trim();

      if (!strasse) {
        alert("Bitte gib eine Straße ein!");
        return;
      }

      // Sendet die Daten als JSON-Objekt zurück an den Bot
      tg.sendData(JSON.stringify({ bezirk: bezirk, strasse: strasse }));
    }
  </script>
</body>
</html>
