<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parksheriff Melder Wien</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1c1c1e;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }
    h2 { text-align: center; margin-top: 10px; color: #ff3b30; }
    p { text-align: center; color: #8e8e93; font-size: 14px; }
    label { font-weight: bold; display: block; margin-top: 18px; margin-bottom: 6px; color: #e5e5ea; }
    select, input {
      width: 100%;
      padding: 14px;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: #2c2c2e;
      color: #ffffff;
      outline: none;
    }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      background-color: #ff3b30;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background-color: #d70015; }
  </style>
</head>
<body>

  <h2>🚨 Parksheriff Melden</h2>
  <p>Melde eine Sichtung direkt an den Bot</p>

  <label for="bezirk">Bezirk auswählen:</label>
  <select id="bezirk">
    <script>
      for (let i = 1; i <= 23; i++) {
        document.write(`<option value="${i}. Bezirk">${i}. Bezirk</option>`);
      }
    </script>
  </select>

  <label for="strasse">Straße & Hausnummer / Gasse:</label>
  <input type="text" id="strasse" placeholder="z. B. Mariahilfer Straße 45">

  <button onclick="sendData()">Meldung Absenden</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function sendData() {
      const bezirk = document.getElementById('bezirk').value;
      const strasse = document.getElementById('strasse').value.trim();

      if (!strasse) {
        alert("Bitte gib eine Straße ein!");
        return;
      }

      // Übergibt die eingegebenen Daten sicher als JSON an Telegram
      tg.sendData(JSON.stringify({ bezirk: bezirk, strasse: strasse }));
      tg.close();
    }
  </script>
</body>
</html>
